name: Android release

# Manual only: run it from the Actions tab (or `gh workflow run android-release`),
# pass the version and the workflow builds the APK and publishes a GitHub release.
#
# The APK is signed with one permanent key, so a new version installs over the
# old one. The key comes from these repository secrets:
#   ANDROID_KEYSTORE_BASE64    the .jks keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          the key alias
#   ANDROID_KEY_PASSWORD       the key password
# Never replace the key: phones would have to uninstall the app to update.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.2.0 ("v" prefix is allowed)'
        required: true
        type: string
      version_code:
        description: 'Android versionCode (optional, derived from the version when empty)'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark the GitHub release as a pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create the GitHub release as a draft'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Releases are serialized per branch: two dispatches never race on tags/assets.
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Resolve release version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail

          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$INPUT_VERSION')"
            exit 1
          fi

          version_code="${INPUT_VERSION_CODE}"
          if [[ -z "$version_code" ]]; then
            numeric="${version%%[-+]*}"
            IFS=. read -r major minor patch <<< "$numeric"
            version_code=$(( major * 10000 + minor * 100 + patch ))
          fi
          if [[ ! "$version_code" =~ ^[0-9]+$ ]] ||
             (( version_code < 1 || version_code > 2100000000 )); then
            echo "::error::versionCode must be a positive integer (got '$version_code')"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version $version (versionCode $version_code, tag v$version)"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(command -v sdkmanager)"
          fi

          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platform-tools" "build-tools;37.0.0" "platforms;android-37.0" \
            || "$sdkmanager" "platform-tools" "build-tools;37.0.0" "platforms;android-37"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing; see the comment at the top of this workflow."
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          base64 --decode > "$keystore" <<< "$KEYSTORE_BASE64"
          echo "BELLTIMER_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          BELLTIMER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BELLTIMER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BELLTIMER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease testDebugUnitTest \
            -PappVersionName="${{ steps.meta.outputs.version }}" \
            -PappVersionCode="${{ steps.meta.outputs.version_code }}"
          rm -f "$BELLTIMER_KEYSTORE_FILE"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          mkdir -p dist
          apk="dist/bell-timer-v${version}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          (cd dist && sha256sum "bell-timer-v${version}.apk" > "bell-timer-v${version}.apk.sha256")

          # The app finds this manifest when it checks for updates and refuses
          # to suggest a version that cannot drive the firmware on the device.
          models=android/app/src/main/java/com/belltimer/app/data/Models.kt
          min_fw="$(sed -n 's/^const val MIN_FIRMWARE_VERSION = "\([^"]\+\)".*/\1/p' "$models")"
          if [[ -z "$min_fw" ]]; then
            echo "::error::Could not read MIN_FIRMWARE_VERSION from $models"
            exit 1
          fi
          jq -n \
            --arg version "$version" \
            --argjson version_code "${{ steps.meta.outputs.version_code }}" \
            --arg min_firmware "$min_fw" \
            --arg file "bell-timer-v${version}.apk" \
            --arg sha256 "$(sha256sum "$apk" | cut -d' ' -f1)" \
            '{version: $version, version_code: $version_code, min_firmware: $min_firmware,
              file: $file, sha256: $sha256}' > dist/app.json
          cat dist/app.json
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bell-timer-v${{ steps.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail

          checksum="$(cut -d' ' -f1 "dist/bell-timer-v${VERSION}.apk.sha256")"

          {
            echo "**Bell timer Android ${VERSION}** (versionCode ${VERSION_CODE})"
            echo
            echo "Signed APK of the Bell timer control app for the ESP32 bell timer."
            echo "Needs firmware $(jq -r .min_firmware dist/app.json) or newer on the device."
            echo
            echo "Install on the phone:"
            echo
            echo '```bash'
            echo "adb install -r bell-timer-v${VERSION}.apk"
            echo '```'
            echo
            echo "SHA-256: \`${checksum}\`"
          } > release-notes.md

          flags=(--title "Bell timer v${VERSION}" --notes-file release-notes.md)
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          if [[ "$DRAFT" == "true" ]]; then
            flags+=(--draft)
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, replacing its assets."
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" "${flags[@]}"
          else
            gh release create "$TAG" dist/* "${flags[@]}" --target "$GITHUB_SHA"
          fi

      - name: Write job summary
        run: |
          {
            echo "## Bell timer v${{ steps.meta.outputs.version }}"
            echo
            echo "- versionName: \`${{ steps.meta.outputs.version }}\`"
            echo "- versionCode: \`${{ steps.meta.outputs.version_code }}\`"
            echo "- tag: \`${{ steps.meta.outputs.tag }}\`"
            echo "- APK: \`bell-timer-v${{ steps.meta.outputs.version }}.apk\`"
          } >> "$GITHUB_STEP_SUMMARY"
